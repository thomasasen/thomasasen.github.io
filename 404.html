<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Thomas Asen</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .error-page {
      min-height: calc(100vh - 184px);
      display: grid;
      place-items: center;
      padding: 60px 0;
    }
    .error-inner { width: 100%; }
    .error-code {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .15em;
    }
    .error-title {
      max-width: 800px;
      margin: 0 0 28px;
      font-size: clamp(48px, 9vw, 94px);
      font-weight: 620;
      line-height: .98;
      letter-spacing: -.055em;
    }
    .error-link {
      display: inline-flex;
      margin-top: 18px;
      font-size: 13px;
      font-weight: 720;
      text-underline-offset: 5px;
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Startseite">
        <span class="brand-mark" aria-hidden="true">TA</span>
        <span class="brand-name">Thomas Asen</span>
      </a>
      <a class="header-link" href="https://github.com/thomasasen" target="_blank" rel="noreferrer">
        GitHub <span aria-hidden="true">↗</span>
      </a>
    </header>

    <main class="error-page">
      <div class="error-inner">
        <p class="error-code">404 / NOT FOUND</p>
        <h1 class="error-title">Diese Seite gibt es nicht.</h1>
        <p>Der Link ist möglicherweise veraltet oder die Adresse wurde falsch eingegeben.</p>
        <a class="error-link" href="/">Zurück zu Tools &amp; Services →</a>
      </div>
    </main>

    <footer class="site-footer">
      <p>Thomas Asen</p>
      <p>Hosted on GitHub Pages</p>
    </footer>
  </div>
</body>
</html>
